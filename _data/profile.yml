  research: "职业方向上，我希望继续深耕 EDA、计算光刻与高性能算法工程。博士研究方面，我更关注家庭服务机器人：如何结合视觉感知、触觉反馈与适当的自动化程度，让机器人与人的协作更实用、更容易理解。这是我希望继续探索的研究方向，并非已有家庭机器人落地成果的描述。"
