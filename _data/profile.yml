  employment_entries:
    - period: "Sep 2024–present"
      title: "Algorithm Engineer"
      project_role: "Technical lead for GDS rasterization and data-processing software"
      cv_role: "GDS software technical lead"
      organization: "Taizhou Optoelectronics Industry Innovation Center · Taizhou, China"
      cv_organization: "Taizhou Optoelectronics Industry Innovation Center"
      details:
        - "Lead core technical design and software development for GDS rasterization and data processing. Coordinate development tasks and equipment interfaces, maintain core code, and drive performance optimization and complex issue resolution. Helped turn the subpixel method into a granted patent, and support operation and maintenance through documentation and remote assistance."
        - "Ported the rasterization kernel from Python to C++ and maintain core computational lithography algorithms. Proposed and implemented boundary-focused subpixel rasterization, with detailed area computation at polygon boundaries and filling of interior regions; collaborated with a colleague on Clipper2 integration."
        - "Migrated GDS processing from a small PC to multi-node servers. For the same GDS input and 4-pass workload, measured milestones improved from 800 to 24 minutes (33.3× end to end, including hardware and deployment changes). Partitioned input reads separately reduced 92 to 44 minutes on unchanged server hardware and node count."
        - "Resolved out-of-memory failures on 256 GB nodes through block processing, initialization-time buffer allocation and memory reuse, keeping peak memory below 120 GB per node."
        - "Designed an online computation–processing pipeline with the equipment team, using a shared filesystem and bidirectional backpressure. Publish configuration files only after the corresponding data blocks are complete; persist task progress to support checkpoint recovery, verified through interruption/restart testing."
        - "Built a FastAPI-based centralized logging platform with unified HTTP ingestion for all four equipment subsystems. Persistent task logs replaced transient console output and enabled device/task-based queries for debugging."
        - "Maintain core code and startup/operation documentation for remote support. Work with a tester using an established GDS test library; regression checks are manually executed."
      cv_details:
        - "Designed boundary-focused subpixel rasterization; ported Python to C++ and deployed across six nodes. Same GDS / 4-pass workload: 800 to 24 min (33.3× end to end, including platform changes)."
        - "Partitioned reads: 92 to 44 min on unchanged hardware and node count. Block processing, preallocation and buffer reuse resolved OOM on 256 GB nodes; peak memory below 120 GB per node."
        - "Designed a shared-filesystem pipeline to compute during equipment processing, with backpressure and data-ready signals. Persisted task progress for checkpoint recovery; verified interruption/restart behavior."
        - "Built a FastAPI logging platform covering all four equipment subsystems, with persistent task logs and device/task queries for debugging."
        - "Coordinate development tasks and equipment interfaces; maintain core code and operation documentation for remote support. Collaborate on manual regression using a fixed GDS test library."
    - period: "Apr–Aug 2024"
      title: "Algorithm Development"
      organization: "Hesai Technology / Sharpa-related R&D · 禾赛科技"
      details:
        - "Formal employer: Hesai Technology. Responsibilities covered Hesai LiDAR algorithms and Sharpa-related vision-based tactile-sensor R&D."
        - "Worked on LiDAR functional-degradation algorithms and noise-segmentation model training."
        - "Designed and trained mechanical models for vision-based tactile sensors."
        - "Model training and software development on Ubuntu."
      cv_details:
        - "At Hesai Technology, developed LiDAR functional-degradation algorithms and trained noise-segmentation models; also contributed to Sharpa-related tactile-sensor R&D."
        - "Designed and trained vision-based tactile-sensor mechanical models; developed software on Ubuntu."
