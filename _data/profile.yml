  employment_entries:
    - period: "Sep 2024–present"
      title: "Algorithm Engineer"
      organization: "台州光电产业创新中心 · Taizhou, China"
      details:
        - "EDA-related algorithms and computational lithography, including electron-beam lithography OPC-related work. The selected 2024–2025 performance case concerns GDS rasterization for laser direct writing."
        - "Migrated the GDS rasterization kernel from Python to C++, then optimized computation, parallel processing, memory access and data reading."
        - "Took the workload from an initial small-PC estimate of tens of thousands of hours to a measured 24-minute six-node server run. Migrated and adapted the pipeline to large multi-node servers; measured PC-to-server milestones improved from 800 to 24 minutes (33.3× end to end, including platform changes)."
        - "Reduced a same-condition server benchmark from 92 to 44 minutes by partitioning reads so each node loads only its assigned data. A separate six-node configuration completed the same 4-pass workload in 24 minutes."
        - "Developed supporting visualization and equipment-control software."
    - period: "Apr–Aug 2024"
      title: "Algorithm Development"
      organization: "Hesai Technology / Sharpa-related R&D · 禾赛科技"
      details:
        - "Formal employer: Hesai Technology. Responsibilities covered Hesai LiDAR algorithms and Sharpa-related vision-based tactile-sensor R&D."
        - "Worked on LiDAR functional-degradation algorithms and noise-segmentation model training."
        - "Designed and trained mechanical models for vision-based tactile sensors."
        - "Model training and software development on Ubuntu."
  education_entries:
    - period: "2022–Mar 2024"
      title: "M.S., Mechanical Engineering"
      organization: "Waseda University · Japan"
      detail: "Department of Modern Mechanical Engineering, Graduate School of Creative Science and Engineering. Research supervised by Hiroyasu Iwata."
    - period: "2017–2021"
      title: "B.S., Mechanical Science & Engineering"
      organization: "Huazhong University of Science and Technology · China"
      detail: "Undergraduate work included industrial-robot experimental platforms and control / visualization integration."
