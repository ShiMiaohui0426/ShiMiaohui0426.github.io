  employment_entries:
    - period: "Sep 2024–present"
      title: "Algorithm Engineer"
      project_role: "Core computation technical lead (project responsibility)"
      cv_role: "Core computation technical lead (project role)"
      organization: "Taizhou Optoelectronics Industry Innovation Center · Taizhou, China"
      cv_organization: "Taizhou Optoelectronics Industry Innovation Center"
      details:
      - 'Take informal technical leadership of the core computation pipeline in a six-person team: evaluate technical options, make performance trade-offs and split development tasks. Coordinate colleagues on line generation, geometry-intersection optimization, parts of correction and equipment communication.'
      - Building on colleagues' Python prototype, proposed and validated boundary-focused subpixel computation with interior filling. Led the core C++ implementation, OpenMP parallelism and multi-node execution with static spatial partitioning; used prototype experiments to evaluate the implementation route.
      - Combined loop fusion with flame-graph-guided Clipper2 intersection optimization, collaborating with a colleague on the latter. On the same six-node configuration and test data, reduced 4-pass runtime from 44 to 24 minutes (about 45%); the 24-minute run includes computation, correction and equipment format conversion.
      - Resolved OOM on 256 GB nodes through block processing, initialization-time preallocation and buffer reuse; observed memory use below 120 GB after optimization. Also overlapped I/O with computation and integrated parts of correction into format conversion.
      - Proposed online data generation and implemented the pipeline with the equipment team. Shared-filesystem data-ready signals and bidirectional waiting coordinate production and consumption; persisted stripe-level task state enables computational restart from checkpoints, tested through interruption and recovery.
      - Proactively built a Python / FastAPI logging platform, using AI-assisted development, with HTTP ingestion from all four equipment subsystems. Added device registration, log search and filtering so historical task logs remain available during joint debugging.
      - Validate against a full-image baseline and an independent implementation, and support equipment integration. Maintain startup and operation guides that help testers restore the program independently; regression checks use an established GDS test library and are manually executed.
      cv_details:
      - Guide core technical decisions and task coordination in a six-person team. Building on colleagues' Python prototype, proposed boundary-focused rasterization and led C++ / OpenMP and multi-node implementation.
      - Loop fusion and flame-graph-guided Clipper2 optimization cut 4-pass runtime from 44 to 24 min (about 45%) on the same six nodes and test data. The 24-min run includes correction and format conversion.
      - Block processing, preallocation and buffer reuse resolved OOM on 256 GB nodes; observed memory use below 120 GB. Overlapped I/O with computation and reduced intermediate data.
      - Proposed an online equipment data pipeline with shared-filesystem readiness signals and backpressure. Persisted stripe-level state enables computational checkpoint recovery, verified by interruption tests.
      - Built FastAPI logging for all four equipment subsystems. Maintain startup / operation guides for remote support; collaborate with testers on manual regression using a fixed GDS library.
    - period: "Apr–Aug 2024"
      title: "Algorithm Development"
      organization: "Hesai Technology / Sharpa-related R&D · 禾赛科技"
      details:
        - "Formal employer: Hesai Technology. Responsibilities covered Hesai LiDAR algorithms and Sharpa-related vision-based tactile-sensor R&D."
        - "Worked on LiDAR functional-degradation algorithms and noise-segmentation model training."
        - "Designed and trained mechanical models for vision-based tactile sensors."
        - "Model training and software development on Ubuntu."
      cv_details:
        - "At Hesai Technology, developed LiDAR functional-degradation algorithms and trained noise-segmentation models; also contributed to Sharpa-related tactile-sensor R&D."
        - "Designed and trained vision-based tactile-sensor mechanical models; developed software on Ubuntu."
