  employment_entries:
    - period: "2024.09–至今"
      title: "算法工程师"
      organization: "台州光电产业创新中心 · 中国台州"
      details:
        - "从事 EDA 与计算光刻相关算法工作，涉及电子束光刻 OPC；本页展示的 2024–2025 年性能案例为激光直写中的 GDS 光栅化。"
        - "将 GDS 光栅化内核由 Python 移植到 C++，持续优化计算逻辑、并行处理、内存访问与数据读取。"
        - "将任务从小型 PC 上初始预计的数万小时推进到六节点服务器实测 24 分钟，完成向大型多节点服务器的迁移与适配；已实测的 PC → 服务器阶段由 800 分钟降至 24 分钟，约 33.3 倍端到端加速（包含平台变化）。"
        - "通过分块读取，让每个节点仅加载所需数据，同条件服务器测试耗时由 92 分钟降至 44 分钟。另在六节点配置下，相同 4-pass 工作负载耗时 24 分钟。"
        - "开发配套可视化与设备控制软件。"
    - period: "2024.04–2024.08"
      title: "算法研发"
      organization: "禾赛科技 / Sharpa 相关研发"
      details:
        - "正式雇主为禾赛科技，工作覆盖禾赛激光雷达算法与 Sharpa 相关的视触觉传感器研发。"
        - "负责激光雷达功能降级相关算法与噪声分割模型训练。"
        - "负责视触觉传感器力学模型的设计与训练。"
        - "在 Ubuntu 环境下进行模型训练与软件开发。"
  education_entries:
    - period: "2022–2024.03"
      title: "机械工程硕士"
      organization: "早稻田大学 · 日本"
      detail: "创造理工学研究科，综合机械工学专攻（Department of Modern Mechanical Engineering）。研究导师：岩田浩康（Hiroyasu Iwata）。"
    - period: "2017–2021"
      title: "机械科学与工程学士"
      organization: "华中科技大学 · 中国"
      detail: "本科阶段参与工业机器人实验平台、控制与可视化集成等工作。"
  earlier_entries:
    - period: "2022.10–2022.12"
      title: "Learning Assistant · 早稻田大学"
      detail: "参与编程相关课程答疑、学习指导与考核工作。指导教师：岩田浩康。"
    - period: "2019.12–2022.02"
      title: "研究助理 · 华中科技大学"
      detail: "参与原型开发、厂商对接、教学资料编写与课程设计。指导教师：黄弢。"
