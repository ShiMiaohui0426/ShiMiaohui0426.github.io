  employment_entries:
    - period: "2024.09–至今"
      title: "算法工程师"
      project_role: "GDS 光栅化与数据处理软件技术牵头"
      cv_role: "GDS 光栅化与数据处理软件技术牵头"
      organization: "台州光电产业创新中心 · 中国台州"
      cv_organization: "台州光电产业创新中心"
      details:
        - "牵头核心技术方案设计与软件研发，提出边界稀疏光栅化及计算—加工流水线方案，协调开发分工与设备端接口协同；持续负责核心代码维护、性能优化和复杂问题定位，推动相关技术形成授权专利，并通过操作文档与远程支持保障软件运行维护。"
        - "将光栅化内核由 Python 移植至 C++，并持续维护计算光刻核心算法。提出并落地面向多边形边界的亚像素光栅化路线，对边界区域计算覆盖面积、对内部区域填充，并与同事协作完成 Clipper2 集成。"
        - "将 GDS 处理由小型 PC 迁移至多节点服务器。同一 GDS 输入与 4-pass 工作负载的实测阶段由 800 分钟降至 24 分钟，约 33.3 倍端到端加速（含硬件及部署变化）；按节点分块读取另使同硬件、同节点数测试由 92 分钟降至 44 分钟。"
        - "针对 256 GB 节点上的 OOM 问题，采用分块计算、初始化预分配与缓冲区复用，将单节点峰值内存控制在 120 GB 以下。"
        - "提出在线计算与加工流水线，并与设备端协同实现共享文件系统上的双向背压。数据块写完后再发布配置文件作为就绪信号；持久化任务进度，支持异常后的断点续算，并完成中断与重启恢复验证。"
        - "主动开发基于 FastAPI 的集中日志平台，通过统一 HTTP 接口接入整机全部 4 个子系统。将临时控制台输出转为可持久化的任务日志，支持按设备、任务查询与排障。"
        - "持续维护核心代码及启动、操作文档，支持远程诊断与维护；与测试同事使用固定 GDS 测试库开展人工回归验证。"
      cv_details:
        - "提出边界稀疏亚像素光栅化路线，将核心算法由 Python 移植至 C++ 并迁移至六节点服务器。同一 GDS 输入、4-pass 工作负载实测由 800 分钟降至 24 分钟，约 33.3 倍端到端加速（含平台变化）。"
        - "按节点分块读取使同硬件、同节点数测试由 92 分钟降至 44 分钟；通过分块计算、初始化预分配及缓冲区复用，解决 256 GB 节点 OOM，将单节点峰值内存控制在 120 GB 以下。"
        - "设计计算与设备加工并行的在线流水线，基于共享文件系统、双向背压与数据就绪信号协调生产消费；持久化任务进度，支持断点续算并完成中断、重启恢复验证。"
        - "开发 FastAPI 集中日志平台，接入整机全部 4 个子系统，实现任务日志持久化与按设备、任务查询，支持联调排障。"
        - "协调开发分工与设备端接口协同，负责核心代码维护及复杂问题定位；维护启动、操作文档并支持远程维护，与测试同事基于固定 GDS 测试库开展人工回归验证。"
    - period: "2024.04–2024.08"
      title: "算法研发"
      organization: "禾赛科技 / Sharpa 相关研发"
      details:
        - "正式雇主为禾赛科技，工作覆盖禾赛激光雷达算法与 Sharpa 相关的视触觉传感器研发。"
        - "负责激光雷达功能降级相关算法与噪声分割模型训练。"
        - "负责视触觉传感器力学模型的设计与训练。"
        - "在 Ubuntu 环境下进行模型训练与软件开发。"
      cv_details:
        - "正式任职单位为禾赛科技，负责激光雷达功能降级算法、噪声分割模型训练，同时参与 Sharpa 相关视触觉传感器研发。"
        - "设计与训练视触觉传感器力学模型，在 Ubuntu 下进行模型训练及软件开发。"
