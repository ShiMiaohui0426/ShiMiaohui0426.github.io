    - period: "2024.09–至今"
      title: "算法工程师"
      project_role: "核心计算链路技术牵头（项目职责）"
      cv_role: "核心计算链路技术牵头（项目职责）"
      organization: "台州光电产业创新中心 · 中国台州"
      cv_organization: "台州光电产业创新中心"
      details:
      - 在六人团队中承担核心计算链路的非正式技术牵头职责，负责技术路线评估、关键性能取舍和任务拆分；协同推进直线生成、几何求交优化、部分校正及设备通信开发。
      - 从同事已有的 Python 基础原型接手，提出并验证边界区域精细计算与内部填充方案；主导核心 C++ 链路、OpenMP 并行及按空间静态分区的多节点实现，通过原型实验评估技术路线。
      - 通过循环融合减少跨阶段中间数据，并依据火焰图定位热点，与同事协作优化 Clipper2 求交路径。同一六节点配置、相同测试数据下，将 4-pass 耗时由 44 分钟降至 24 分钟，下降约 45%；24 分钟包含计算、校正与设备格式转换。
      - 针对 256 GB 节点上的 OOM 问题，采用分块计算、初始化预分配及缓冲区复用，优化后观察到运行内存低于 120 GB；推进计算与读写重叠，并将部分校正融入设备格式转换。
      - 提出在线数据生成方案，与设备端协同落地共享文件系统上的生产消费流程，通过就绪信号与双向等待协调数据供应；持久化条带级任务状态，支持经中断恢复测试验证的计算侧断点续算。
      - 主动开发 Python / FastAPI 集中日志平台，开发中使用 AI 辅助，通过 HTTP 接口接入整机全部四个子系统，提供设备注册、日志查询与筛选，使历史任务日志可回溯，支撑跨子系统联调。
      - 开展全图基准对照、独立实现交叉验证及设备联调；维护启动与操作文档，帮助测试同事自主恢复程序运行。与测试同事基于固定 GDS 测试库开展人工回归验证。
      cv_details:
      - 在六人团队中承担核心技术取舍与任务协作。从同事的 Python 原型接手，提出边界稀疏光栅化，主导 C++ / OpenMP 及多节点实现。
      - 通过循环融合及火焰图指导的 Clipper2 专项优化，同六节点、同数据下将 4-pass 耗时由 44 降至 24 分钟，下降约 45%；24 分钟含校正与格式转换。
      - 通过分块计算、预分配及缓冲区复用，解决 256 GB 节点 OOM；优化后观察到运行内存低于 120 GB。推进计算与读写重叠，减少中间数据。
      - 提出边计算边加工的数据流水线，以共享文件系统就绪信号及双向等待协调生产消费；保存条带级状态，支持计算侧断点续算，已做中断恢复测试。
      - 开发 FastAPI 日志平台，接入整机全部四个子系统。维护启动、操作文档并支持远程维护，协同测试同事基于固定 GDS 库开展人工回归。
    - period: "2024.04–2024.08"
      title: "算法研发"
      organization: "禾赛科技 / Sharpa 相关研发"
      details:
        - "正式雇主为禾赛科技，工作覆盖禾赛激光雷达算法与 Sharpa 相关的视触觉传感器研发。"
        - "负责激光雷达功能降级相关算法与噪声分割模型训练。"
        - "负责视触觉传感器力学模型的设计与训练。"
        - "在 Ubuntu 环境下进行模型训练与软件开发。"
      cv_details:
